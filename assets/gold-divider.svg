<svg width="100%" height="3" viewBox="0 0 1200 3" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808" stop-opacity="0" />
      <stop offset="25%" stop-color="#806B48" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#C6A66B" stop-opacity="1">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#806B48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="1" width="1200" height="1" fill="url(#shimmer)" />
</svg>