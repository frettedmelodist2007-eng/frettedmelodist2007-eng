<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .rotating {
      transform-origin: 24px 24px;
      animation: spin 24s linear infinite;
    }
    .pulsing {
      transform-origin: 24px 24px;
      animation: pulse 3.5s ease-in-out infinite;
    }
  </style>
  <circle cx="24" cy="24" r="22" stroke="#292929" stroke-width="1" stroke-dasharray="2 3" />
  <g class="rotating">
    <rect x="18" y="18" width="12" height="12" transform="rotate(45 24 24)" stroke="#806B48" stroke-width="1" />
    <circle cx="24" cy="24" r="11" stroke="#C6A66B" stroke-width="0.75" stroke-dasharray="4 2" />
  </g>
  <circle cx="24" cy="24" r="2.5" fill="#C6A66B" class="pulsing" />
</svg>